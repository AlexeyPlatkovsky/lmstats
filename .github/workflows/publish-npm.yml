name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish when the version is new
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify package
        run: |
          npm test
          ruff check .
          pytest

      - name: Decide whether this version is already published
        id: version
        run: node scripts/should-publish.mjs "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
