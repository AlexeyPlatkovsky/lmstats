<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%233fb950'/></svg>">
<title>LM Speed Viewer</title>
<style>
  :root {
    --bg: #0b0e14;
    --fg: #c9d1d9;
    --dim: #8b949e;
    --accent: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --line: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .panel { width: min(540px, 92vw); padding: 28px 32px; }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 30px;
  }
  h1 { font-size: 12px; letter-spacing: .2em; color: var(--dim); font-weight: 600; }
  .status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.connected { background: var(--accent); box-shadow: 0 0 8px rgba(63,185,80,.7); }
  .dot.waiting { background: var(--warn); box-shadow: 0 0 8px rgba(210,153,34,.7); }
  .dot.disconnected, .dot.error { background: var(--err); box-shadow: 0 0 8px rgba(248,81,73,.6); }
  .speed {
    font-size: clamp(56px, 14vw, 88px); line-height: 1.05; font-weight: 700;
    color: var(--accent); text-align: center; font-variant-numeric: tabular-nums;
  }
  .speed .unit { font-size: 24px; color: var(--dim); margin-left: 10px; font-weight: 500; }
  .model { text-align: center; font-size: 16px; margin-top: 10px; color: var(--fg); }
  table { width: 100%; border-collapse: collapse; margin-top: 30px; }
  td { padding: 8px 0; font-size: 15px; border-bottom: 1px solid var(--line); }
  td.k { color: var(--dim); width: 45%; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 20px; color: var(--dim); font-size: 13px; display: flex; justify-content: space-between; }

  /* History section */
  .history { margin-top: 30px; }
  .history h2 {
    font-size: 12px; letter-spacing: .2em; color: var(--dim); font-weight: 600;
    margin-bottom: 10px;
  }
  .range-btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .range-btns button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    font-family: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
    border-radius: 3px;
  }
  .range-btns button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent);
  }
  .range-btns button:hover { border-color: var(--dim); }
  #graphArea {
    width: 100%; height: 200px; background: rgba(255,255,255,.02);
    border: 1px solid var(--line); border-radius: 4px; position: relative;
    overflow: hidden;
  }
  #graphArea svg { width: 100%; height: 100%; display: block; }
  #graphArea .empty-text {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--dim); font-size: 13px;
  }
  #graphArea svg, #graphArea .empty-text { transition: opacity .2s; }
  #graphArea svg { opacity: 1; }
  #graphArea svg.dim { opacity: .5; }
  #graphArea .empty-text.hidden { display: none; }
  #legend {
    display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap;
    font-size: 12px; color: var(--dim);
  }
  #legend .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 4px; vertical-align: middle;
  }
  #tooltip {
    position: absolute; pointer-events: none; background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
    font-size: 12px; color: var(--fg); display: none; white-space: nowrap;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="panel">
  <header>
    <h1>LM SPEED VIEWER</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">Connecting…</span></span>
  </header>

  <div class="speed"><span id="speed">—</span><span class="unit" id="speedUnit"></span></div>
  <div class="model" id="model">—</div>

  <table>
    <tr><td class="k">TTFT</td><td class="v" id="ttft">—</td></tr>
    <tr><td class="k">Prompt</td><td class="v" id="prompt">—</td></tr>
    <tr><td class="k">Output</td><td class="v" id="output">—</td></tr>
    <tr><td class="k">Total</td><td class="v" id="total">—</td></tr>
    <tr><td class="k">Generation time</td><td class="v" id="gentime">—</td></tr>
  </table>

  <div class="history">
    <h2>GENERATION SPEED HISTORY</h2>
    <div class="range-btns" id="rangeBtns">
      <button data-range="5m">5m</button>
      <button data-range="1h" aria-pressed="true">1h</button>
      <button data-range="24h">24h</button>
    </div>
    <div id="graphArea">
      <div class="empty-text" id="emptyText">No generations recorded in this period.</div>
      <svg id="graphSvg" style="display:none;"></svg>
      <div id="tooltip"></div>
    </div>
    <div id="legend"></div>
  </div>

  <div class="foot"><span>Last update: <span id="updated">—</span></span><span>v0.2</span></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function fmt(v, kind) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  if (kind === "int") return Math.round(v).toLocaleString("en-US");
  if (kind === "sec") return v.toFixed(1) + " s";
  if (kind === "tps") return v.toFixed(1);
  return String(v);
}

function render(s) {
  const c = s.collector || "disconnected";
  const p = s.prediction;

  let dotClass, statusText;
  if (c === "connected" && p) { dotClass = "connected"; statusText = "Connected"; }
  else if (c === "connected") { dotClass = "waiting"; statusText = "Waiting for first prediction"; }
  else if (c === "error") { dotClass = "error"; statusText = s.detail ? `Error: ${s.detail}` : "Error"; }
  else { dotClass = c; statusText = s.detail ? `${c[0].toUpperCase() + c.slice(1)}: ${s.detail}` : c[0].toUpperCase() + c.slice(1); }

  $("dot").className = "dot " + dotClass;
  $("statusText").textContent = statusText;

  const hasSpeed = p && p.tokensPerSecond !== null && p.tokensPerSecond !== undefined;
  $("speed").textContent = hasSpeed ? fmt(p.tokensPerSecond, "tps") : "—";
  $("speedUnit").textContent = hasSpeed ? "tok/s" : "";
  $("model").textContent = (p && p.modelIdentifier) || "—";

  $("ttft").textContent = fmt(p && p.timeToFirstTokenSec, "sec");
  $("prompt").textContent = fmt(p && p.promptTokensCount, "int");
  $("output").textContent = fmt(p && p.predictedTokensCount, "int");
  $("total").textContent = fmt(p && p.totalTokensCount, "int");
  $("gentime").textContent = fmt(p && p.totalTimeSec, "sec");

  if (p && p.timestampMs) {
    $("updated").textContent = new Date(p.timestampMs).toLocaleTimeString("en-GB", { hour12: false });
  } else {
    $("updated").textContent = "—";
  }
}

const es = new EventSource("/events");
es.onmessage = (e) => { try { render(JSON.parse(e.data)); scheduleHistoryRefresh(); } catch (_) {} };
es.onerror = () => { /* EventSource reconnects automatically */ };

/* ── History graph ── */
const PALETTE = ["#3fb950","#58a6ff","#d29922","#bc8cff","#f778ba","#39c5cf"];
const RANGE_DURATIONS = { "5m": 300, "1h": 3600, "24h": 86400 };

function djb2(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h;
}

function modelColor(model) {
  if (model === null || model === undefined) return "var(--dim)";
  return PALETTE[djb2(model) % PALETTE.length];
}

let currentRange = "1h";
let fetchSeq = 0;
let pendingRefresh = false;
let lastRefreshedMs = null;

function fetchHistory(range) {
  const seq = ++fetchSeq;
  const svg = $("graphSvg");
  const empty = $("emptyText");
  const area = $("graphArea");
  svg.classList.add("dim");

  fetch("/api/history?range=" + encodeURIComponent(range))
    .then(r => r.json())
    .then(data => {
      if (seq !== fetchSeq) return;
      svg.classList.remove("dim");
      renderGraph(data);
    })
    .catch(() => {
      if (seq !== fetchSeq) return;
      svg.style.display = "none";
      svg.classList.remove("dim");
      empty.classList.remove("hidden");
    });
}

function renderGraph(data) {
  const svg = $("graphSvg");
  const empty = $("emptyText");
  const legend = $("legend");
  const area = $("graphArea");

  if (!data.series || data.series.length === 0) {
    svg.style.display = "none";
    empty.classList.remove("hidden");
    legend.innerHTML = "";
    return;
  }

  empty.classList.add("hidden");
  svg.style.display = "block";

  const rect = area.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  const pad = { top: 15, right: 15, bottom: 30, left: 50 };
  const gw = W - pad.left - pad.right;
  const gh = H - pad.top - pad.bottom;

  let maxX = 0, maxY = 0;
  let allPoints = [];
  for (const series of data.series) {
    for (const pt of (series.points || [])) {
      const ts = parseISO(pt.timestamp);
      if (ts > maxX) maxX = ts;
      if (pt.avgTokensPerSecond !== null && pt.avgTokensPerSecond > maxY) {
        maxY = pt.avgTokensPerSecond;
      }
      allPoints.push({ ...pt, _ts: ts });
    }
  }

  const minTs = data.generatedAt ? (parseISO(data.generatedAt) - (RANGE_DURATIONS[currentRange] || 3600)) : maxX;
  const xMin = parseISO(formatTimestamp(minTs));
  const xMax = parseISO(formatTimestamp(maxX));
  const xSpan = xMax - xMin || 1;
  const yMax = maxY > 0 ? maxY * 1.1 : 1;

  function xScale(v) { return pad.left + ((parseISO(formatTimestamp(v)) - xMin) / xSpan) * gw; }
  function yScale(v) { return pad.top + gh - (v / yMax) * gh; }

  let svgContent = "";

  const nXLabels = 4;
  for (let i = 0; i <= nXLabels; i++) {
    const ts = xMin + (xSpan * i / nXLabels);
    const x = xScale(ts);
    const d = new Date(ts * 1000);
    const label = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    svgContent += `<text x="${x}" y="${H - 5}" text-anchor="middle" fill="var(--dim)" font-size="10">${label}</text>`;
    svgContent += `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${pad.top + gh}" stroke="var(--line)" stroke-dasharray="2,4"/>`;
  }

  const nYLabels = 3;
  for (let i = 0; i <= nYLabels; i++) {
    const v = (yMax * i / nYLabels);
    const y = yScale(v);
    svgContent += `<text x="${pad.left - 5}" y="${y + 4}" text-anchor="end" fill="var(--dim)" font-size="10">${v.toFixed(1)}</text>`;
    svgContent += `<line x1="${pad.left}" y1="${y}" x2="${pad.left + gw}" y2="${y}" stroke="var(--line)" stroke-dasharray="2,4"/>`;
  }

  for (const series of data.series) {
    const color = modelColor(series.model);
    const pts = series.points || [];
    const visible = pts.filter(p => p.avgTokensPerSecond !== null);
    if (visible.length === 0) continue;

    let pathD = "";
    for (const pt of visible) {
      const x = xScale(pt._ts);
      const y = yScale(pt.avgTokensPerSecond);
      pathD += (pathD ? " L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    }
    svgContent += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.5"/>`;

    for (const pt of pts) {
      const x = xScale(pt._ts);
      const y = pt.avgTokensPerSecond !== null ? yScale(pt.avgTokensPerSecond) : yScale(0);
      svgContent += `<circle cx="${x}" cy="${y}" r="4" fill="${color}" class="pt" data-model="${series.model || 'unknown'}" data-timestamp="${pt.timestamp}" data-tps="${pt.avgTokensPerSecond !== null ? pt.avgTokensPerSecond : 'no speed data'}" data-count="${pt.count}"/>`;
    }
  }

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = svgContent;

  legend.innerHTML = "";
  for (const series of data.series) {
    const name = series.model || "unknown";
    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = modelColor(series.model);
    const label = document.createElement("span");
    label.textContent = name;
    if (name.length > 20) label.textContent = name.slice(0, 19) + "…";
    legend.appendChild(swatch);
    legend.appendChild(label);
  }

  svg.querySelectorAll(".pt").forEach(circle => {
    circle.addEventListener("mouseenter", showTooltip);
    circle.addEventListener("mouseleave", hideTooltip);
    circle.addEventListener("mousemove", moveTooltip);
  });
}

function showTooltip(e) {
  const tt = $("tooltip");
  const pt = e.target;
  const model = pt.getAttribute("data-model");
  const ts = pt.getAttribute("timestamp");
  const tps = pt.getAttribute("data-tps");
  const count = pt.getAttribute("data-count");
  const d = new Date(parseISO(ts) * 1000);
  const timeLabel = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  tt.innerHTML = `${timeLabel}<br>${model}<br>${tps} · ${count} reqs`;
  tt.style.display = "block";
}

function hideTooltip() { $("tooltip").style.display = "none"; }

function moveTooltip(e) {
  const tt = $("tooltip");
  const area = $("graphArea");
  const ar = area.getBoundingClientRect();
  let x = e.clientX - ar.left + 10;
  let y = e.clientY - ar.top - 30;
  if (x + 150 > ar.width) x = e.clientX - ar.left - 160;
  if (y < 0) y = 5;
  tt.style.left = x + "px";
  tt.style.top = y + "px";
}

function scheduleHistoryRefresh() {
  fetchHistory(currentRange);
}

document.getElementById("rangeBtns").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  currentRange = btn.getAttribute("data-range");
  document.querySelectorAll("#rangeBtns button").forEach(b => b.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  fetchHistory(currentRange);
});

fetchHistory("1h");

function parseISO(s) { return new Date(s).getTime() / 1000; }
function formatTimestamp(ms) {
  const d = new Date(ms);
  return d.toISOString().replace(".000Z", "Z");
}
</script>
</body>
</html>
