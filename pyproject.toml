[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstats"
version = "0.10.2"
description = "Passive local LM Studio generation speed viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
lmstats = "lmstats.cli:main"

[tool.setuptools]
packages = ["lmstats"]
py-modules = ["app", "db"]

[tool.setuptools.package-data]
lmstats = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Practical baseline: pyflakes (F) + pycodestyle errors (E).
select = ["E", "F"]

[tool.pytest.ini_options]
# Make the root-level `app` module importable in tests and resolvable by pytest-cov.
pythonpath = ["."]
addopts = "-m 'not browser'"
markers = [
    "browser: executes the shipped frontend in Chromium; run separately with -m browser",
]

[tool.coverage.run]
source = ["lmstats"]
